[project]
name = "subject-knowledge-hub"
version = "1.0.0"
description = "Local subject-scoped PDF knowledge hub with auditable RAG"
requires-python = ">=3.12,<3.13"
dependencies = [
 "fastapi==0.141.1", "starlette==1.3.1", "uvicorn[standard]==0.35.0", "sqlalchemy==2.0.43",
 "alembic==1.16.5", "psycopg[binary]==3.2.9", "pgvector==0.4.1",
 "pydantic==2.11.7", "pydantic-settings==2.10.1", "python-multipart==0.0.31",
 "email-validator==2.3.0", "celery==5.5.3", "redis==6.4.0",
 "openai==1.109.1", "tiktoken==0.11.0", "pypdf==6.16.1", "pdfplumber==0.11.10",
 "httpx==0.28.1", "reportlab==4.4.3", "psutil==7.0.0"
]
[dependency-groups]
dev = ["pytest==9.0.3", "pytest-cov==6.2.1", "ruff==0.12.12"]
[tool.pytest.ini_options]
testpaths = ["tests"]
# Resolve app imports for the pytest console entry point without Docker PYTHONPATH.
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: requires PostgreSQL with pgvector and Redis", "live: paid live OpenAI calls (explicit opt in)", "scalability: 1000-page offline smoke"]
[tool.ruff]
extend = "../ruff.toml"
