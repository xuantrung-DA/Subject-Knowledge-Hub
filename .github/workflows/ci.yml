name: deterministic-checks
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub -d hub_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://hub:hub@127.0.0.1:5432/hub_test
      REDIS_URL: redis://127.0.0.1:6379/15
      STORAGE_DIR: /tmp/hub-ci-pdfs
      OPENAI_API_KEY: ''
      TEST_MODE: 'true'
      RUN_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install uv==0.12.8
          uv sync --frozen
      - name: Python lint and format
        working-directory: backend
        run: |
          uv run --frozen ruff check . ../scripts
          uv run --frozen ruff format --check . ../scripts
      - name: Migrate a fresh PostgreSQL database
        working-directory: backend
        run: uv run --frozen alembic upgrade head
      - name: Unit and real PostgreSQL/Redis integration tests
        working-directory: backend
        run: uv run --frozen pytest -m 'not live and not scalability' --junitxml=../artifacts/backend-tests.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-evidence
          path: artifacts/backend-tests.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: subject-hub-ci
      SKH_BROWSER_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Real browser, API, database and queue; no paid calls
        run: npm run test:browser -- --grep 'actual stack'
        working-directory: frontend
      - name: Capture stack logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/browser-stack.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-evidence
          path: |
            artifacts/browser
            artifacts/browser-report
            artifacts/browser-stack.log
      - if: always()
        run: docker compose down --volumes
